services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policy-signal-app
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/policy_signal
      PORT: 3000
      NODE_ENV: production
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: policy-signal-timescaledb
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policy_signal
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d policy_signal"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  timescaledb_data:
