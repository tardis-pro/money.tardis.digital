services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mit-trading-app
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      STORE_BACKEND: postgres
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/policy_signal
      PORT: 3000
      NODE_ENV: production
      MIT_INTRADAY_REFRESH_SLOTS: "10:00,12:30,14:45"
      LOG_LEVEL: info
      SCREENIPY_PYTHON: python3
      SCREENIPY_SCRIPT_PATH: /app/src/screenipy.py
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mit-network

  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: mit-timescaledb
    ports:
      - "0.0.0.0:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: policy_signal
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d policy_signal"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - mit-network

  scheduler:
    image: alpine:3.19
    container_name: mit-scheduler
    depends_on:
      - app
    environment:
      PIPELINE_URL: http://app:3000/api/mit/pipeline/run
      PNL_REFRESH_URL: http://app:3000/api/mit/pnl/refresh
      FUNDAMENTALS_URL: http://app:3000/api/mit/fundamentals/refresh
      TZ: Asia/Kolkata
    command: >
      sh -c "
        apk add --no-cache curl tzdata &&
        cp /usr/share/zoneinfo/$$TZ /etc/localtime &&
        echo $$TZ > /etc/timezone &&
        echo '0 3 * * 1-5 curl -sS -X POST $$PIPELINE_URL >> /var/log/cron.log 2>&1' > /etc/crontabs/root &&
        echo '30 4 * * 1-5 curl -sS -X POST $$PNL_REFRESH_URL >> /var/log/cron.log 2>&1' >> /etc/crontabs/root &&
        echo '0 2 * * 0 curl -sS -X POST -H \"Content-Type: application/json\" -d \"{\\\"limit\\\": 50}\" $$FUNDAMENTALS_URL >> /var/log/cron.log 2>&1' >> /etc/crontabs/root &&
        touch /var/log/cron.log &&
        crond -f -l 2
      "
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mit-network

networks:
  mit-network:
    driver: bridge

volumes:
  timescaledb_data:
